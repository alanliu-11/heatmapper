<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heatmapper - Create Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    else if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
  </script>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--color-bg);
    }
    .auth-container {
      width: 100%;
      max-width: 400px;
      padding: var(--space-6);
    }
    .auth-card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-xl);
      padding: var(--space-10);
      box-shadow: var(--shadow-md);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-8);
      font-size: var(--text-xl);
      font-weight: 700;
    }
    .auth-logo svg { width: 32px; height: 32px; }
    .auth-title {
      font-size: var(--text-2xl);
      font-weight: 700;
      text-align: center;
      margin-bottom: var(--space-1);
    }
    .auth-subtitle {
      text-align: center;
      color: var(--color-text-secondary);
      font-size: var(--text-sm);
      margin-bottom: var(--space-8);
    }
    .form-group {
      margin-bottom: var(--space-5);
    }
    .form-group label {
      display: block;
      font-size: var(--text-sm);
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--space-2);
    }
    .form-group .input-field {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      font-size: var(--text-base);
    }
    .form-hint {
      font-size: var(--text-xs);
      color: var(--color-text-muted);
      margin-top: var(--space-1);
    }
    .auth-btn {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: var(--color-text);
      color: var(--color-surface);
      border: none;
      border-radius: var(--radius-md);
      font-family: var(--font-sans);
      font-size: var(--text-base);
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
      margin-top: var(--space-2);
    }
    .auth-btn:hover { background: #333; }
    .auth-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .auth-footer {
      text-align: center;
      margin-top: var(--space-6);
      font-size: var(--text-sm);
      color: var(--color-text-secondary);
    }
    .auth-footer a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 600;
    }
    .auth-footer a:hover { text-decoration: underline; }
    .auth-error {
      color: var(--color-accent-red);
      font-size: var(--text-sm);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: var(--radius-md);
      padding: var(--space-3) var(--space-4);
      margin-bottom: var(--space-4);
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="6" fill="#1a1a1a"/>
          <rect x="4" y="16" width="4" height="8" rx="1" fill="#e8913a"/>
          <rect x="9.5" y="11" width="4" height="13" rx="1" fill="#e8913a" opacity="0.7"/>
          <rect x="15" y="6" width="4" height="18" rx="1" fill="#e8913a" opacity="0.85"/>
          <rect x="20.5" y="4" width="4" height="20" rx="1" fill="#e8913a"/>
        </svg>
        Heatmapper
      </div>

      <h1 class="auth-title">Create account</h1>
      <p class="auth-subtitle">Get started with Heatmapper</p>

      <div class="auth-error" id="error"></div>

      <form id="register-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="username">Username</label>
          <input class="input-field" id="username" type="text" placeholder="Choose a username" required minlength="3" maxlength="30" autocomplete="username" />
          <p class="form-hint">3-30 characters</p>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input class="input-field" id="password" type="password" placeholder="Choose a password" required minlength="6" autocomplete="new-password" />
          <p class="form-hint">Minimum 6 characters</p>
        </div>
        <div class="form-group">
          <label for="confirm">Confirm password</label>
          <input class="input-field" id="confirm" type="password" placeholder="Re-enter your password" required autocomplete="new-password" />
        </div>
        <button class="auth-btn" type="submit" id="submit-btn">Create account</button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>

  <script>
    async function handleRegister(e) {
      if (e) e.preventDefault();
      const errEl = document.getElementById("error");
      const btn = document.getElementById("submit-btn");
      if (btn.disabled) return;
      errEl.style.display = "none";

      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirm").value;

      if (password !== confirm) {
        errEl.textContent = "Passwords do not match";
        errEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating account...";

      try {
        const res = await fetch("/api/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: password,
          }),
        });

        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || "Registration failed");
        }

        window.location.href = "/";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Create account";
      }
    }

    document.getElementById("register-form").addEventListener("submit", handleRegister);
    document.getElementById("submit-btn").addEventListener("click", function(e) {
      e.preventDefault();
      handleRegister();
    });
  </script>
</body>
</html>
