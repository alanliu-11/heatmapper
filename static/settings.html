<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heatmapper - Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script>
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
    else if (window.matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
  </script>
</head>
<body>

  <nav class="top-nav">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="6" fill="#1a1a1a"/>
        <rect x="4" y="16" width="4" height="8" rx="1" fill="#e8913a"/>
        <rect x="9.5" y="11" width="4" height="13" rx="1" fill="#e8913a" opacity="0.7"/>
        <rect x="15" y="6" width="4" height="18" rx="1" fill="#e8913a" opacity="0.85"/>
        <rect x="20.5" y="4" width="4" height="20" rx="1" fill="#e8913a"/>
      </svg>
      Heatmapper
    </a>
    <ul class="nav-links">
      <li><a class="nav-link" href="/">Dashboard</a></li>
      <li><a class="nav-link" href="/watchlist">Watchlist</a></li>
      <li><a class="nav-link active" href="/settings">Settings</a></li>
    </ul>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
        <svg id="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        <svg id="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <button class="btn-icon" title="Scan watchlist for divergences" onclick="alert('Go to Dashboard or Watchlist to scan')">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <button class="btn-icon" title="Enable notifications" id="notif-btn" onclick="toggleNotif()">
        <svg id="notif-icon-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/><line x1="1" y1="1" x2="23" y2="23" stroke-width="2"/></svg>
        <svg id="notif-icon-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;color:var(--color-accent-green)"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <div id="user-avatar" class="user-avatar">U</div>
    </div>
  </nav>

  <main class="page-container" style="max-width:720px;">
    <div class="page-header">
      <h1 class="page-title">Settings</h1>
    </div>

    <!-- Account Section -->
    <div class="card mb-4">
      <div class="card-header">
        <h2 class="card-title">Account</h2>
      </div>
      <div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <span class="text-sm text-secondary">Username</span>
          <span class="font-semibold font-mono" id="settings-username">--</span>
        </div>
        <div class="divider"></div>
        <div class="flex justify-between items-center">
          <div>
            <span class="text-sm text-secondary">Email</span>
          </div>
          <div class="flex items-center gap-2">
            <input class="input-field" id="settings-email" type="email" placeholder="your@email.com" style="width:220px;" />
            <button class="btn btn-secondary" onclick="saveEmail()">Save</button>
          </div>
        </div>
        <div id="email-msg" class="text-sm mt-2" style="display:none;"></div>
      </div>
    </div>

    <!-- Password Section -->
    <div class="card mb-4">
      <div class="card-header">
        <h2 class="card-title">Change Password</h2>
      </div>
      <div class="flex flex-col gap-4">
        <div class="input-group">
          <label class="input-label" for="current-password">Current Password</label>
          <input class="input-field" id="current-password" type="password" style="max-width:300px;" autocomplete="current-password" />
        </div>
        <div class="input-group">
          <label class="input-label" for="new-password">New Password</label>
          <input class="input-field" id="new-password" type="password" style="max-width:300px;" autocomplete="new-password" />
        </div>
        <div class="input-group">
          <label class="input-label" for="confirm-password">Confirm New Password</label>
          <input class="input-field" id="confirm-password" type="password" style="max-width:300px;" autocomplete="new-password" />
        </div>
        <div>
          <button class="btn btn-secondary" onclick="changePassword()">Update Password</button>
        </div>
        <div id="password-msg" class="text-sm mt-2" style="display:none;"></div>
      </div>
    </div>

    <!-- Notifications Section -->
    <div class="card mb-4">
      <div class="card-header">
        <h2 class="card-title">Notifications</h2>
      </div>
      <div class="flex flex-col gap-4">
        <div class="flex justify-between items-center">
          <div>
            <span class="text-sm">Push Notifications</span>
            <p class="text-xs text-muted mt-2">Get alerts when sentiment shifts on your watched stocks</p>
          </div>
          <button class="btn btn-secondary" id="push-toggle-btn" onclick="togglePush()">Enable</button>
        </div>
      </div>
    </div>

    <!-- Sign Out -->
    <div class="card">
      <div class="card-header">
        <h2 class="card-title">Session</h2>
      </div>
      <div class="flex justify-between items-center">
        <div>
          <span class="text-sm">Sign out of your account</span>
          <p class="text-xs text-muted mt-2">You'll need to sign back in to access your dashboard</p>
        </div>
        <button class="btn btn-primary" style="background:var(--color-accent-red);border-color:var(--color-accent-red);" onclick="handleLogout()">Sign Out</button>
      </div>
    </div>
  </main>

  <script>
    async function loadUser() {
      try {
        const res = await fetch("/api/me");
        if (!res.ok) { window.location.href = "/"; return; }
        const user = await res.json();
        document.getElementById("user-avatar").textContent = user.username.charAt(0).toUpperCase();
        document.getElementById("settings-username").textContent = user.username;
        if (user.email) {
          document.getElementById("settings-email").value = user.email;
        }
      } catch { window.location.href = "/"; }
    }

    async function handleLogout() {
      await fetch("/api/logout", { method: "POST" });
      window.location.href = "/";
    }

    function showMsg(id, text, isError) {
      const el = document.getElementById(id);
      el.textContent = text;
      el.style.display = "block";
      el.style.color = isError ? "var(--color-accent-red)" : "var(--color-accent-green)";
      setTimeout(() => { el.style.display = "none"; }, 4000);
    }

    async function saveEmail() {
      const email = document.getElementById("settings-email").value.trim();
      try {
        const res = await fetch("/api/me/email", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        if (!res.ok) { const d = await res.json(); throw new Error(d.detail || "Failed"); }
        showMsg("email-msg", "Email saved.", false);
      } catch (e) { showMsg("email-msg", e.message, true); }
    }

    async function changePassword() {
      const current = document.getElementById("current-password").value;
      const newPw = document.getElementById("new-password").value;
      const confirm = document.getElementById("confirm-password").value;

      if (newPw !== confirm) { showMsg("password-msg", "Passwords do not match.", true); return; }
      if (newPw.length < 6) { showMsg("password-msg", "Password must be at least 6 characters.", true); return; }

      try {
        const res = await fetch("/api/me/password", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ current_password: current, new_password: newPw }),
        });
        if (!res.ok) { const d = await res.json(); throw new Error(d.detail || "Failed"); }
        showMsg("password-msg", "Password updated.", false);
        document.getElementById("current-password").value = "";
        document.getElementById("new-password").value = "";
        document.getElementById("confirm-password").value = "";
      } catch (e) { showMsg("password-msg", e.message, true); }
    }

    async function togglePush() {
      const btn = document.getElementById("push-toggle-btn");

      if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
        btn.textContent = "Not supported";
        btn.disabled = true;
        return;
      }

      const reg = await navigator.serviceWorker.register("/sw.js");
      const existing = await reg.pushManager.getSubscription();

      if (existing) {
        await existing.unsubscribe();
        await fetch("/api/push/subscribe", { method: "DELETE" });
        btn.textContent = "Enable";
        btn.className = "btn btn-secondary";
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== "granted") return;

      try {
        const res = await fetch("/api/push/vapid-key");
        const { publicKey } = await res.json();
        if (!publicKey) { btn.textContent = "Not configured"; btn.disabled = true; return; }

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(publicKey),
        });

        await fetch("/api/push/subscribe", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ subscription: sub.toJSON() }),
        });

        btn.textContent = "Disable";
        btn.className = "btn btn-primary";
      } catch { btn.textContent = "Error"; }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    async function checkPushState() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      try {
        const reg = await navigator.serviceWorker.getRegistration("/sw.js");
        if (!reg) return;
        const sub = await reg.pushManager.getSubscription();
        if (sub) {
          document.getElementById("push-toggle-btn").textContent = "Disable";
          document.getElementById("push-toggle-btn").className = "btn btn-primary";
        }
      } catch {}
    }

    function toggleTheme() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      const next = isDark ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      document.getElementById("theme-icon-light").style.display = isDark ? "block" : "none";
      document.getElementById("theme-icon-dark").style.display = isDark ? "none" : "block";
    }
    (function() {
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";
      document.getElementById("theme-icon-light").style.display = isDark ? "none" : "block";
      document.getElementById("theme-icon-dark").style.display = isDark ? "block" : "none";
    })();

    function setNotifIcon(enabled) {
      document.getElementById("notif-icon-off").style.display = enabled ? "none" : "block";
      document.getElementById("notif-icon-on").style.display = enabled ? "block" : "none";
      document.getElementById("notif-btn").title = enabled ? "Notifications enabled" : "Enable notifications";
    }
    async function toggleNotif() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      const reg = await navigator.serviceWorker.register("/sw.js");
      const existing = await reg.pushManager.getSubscription();
      if (existing) {
        await existing.unsubscribe();
        await fetch("/api/push/subscribe", { method: "DELETE" });
        setNotifIcon(false);
        document.getElementById("push-toggle-btn").textContent = "Enable";
        document.getElementById("push-toggle-btn").className = "btn btn-secondary";
        return;
      }
      const permission = await Notification.requestPermission();
      if (permission !== "granted") return;
      const res = await fetch("/api/push/vapid-key");
      const { publicKey } = await res.json();
      if (!publicKey) return;
      const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(publicKey) });
      await fetch("/api/push/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subscription: sub.toJSON() }) });
      setNotifIcon(true);
      document.getElementById("push-toggle-btn").textContent = "Disable";
      document.getElementById("push-toggle-btn").className = "btn btn-primary";
    }
    async function checkNavNotifState() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      try { const r = await navigator.serviceWorker.getRegistration("/sw.js"); if (r) { const s = await r.pushManager.getSubscription(); if (s) setNotifIcon(true); } } catch {}
    }

    loadUser();
    checkPushState();
    checkNavNotifState();
  </script>
</body>
</html>
