<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Options Heatmap</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: monospace; padding: 24px; }
    h1 { font-size: 1.2rem; margin-bottom: 16px; letter-spacing: 0.05em; color: #58a6ff; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    input, select, button {
      background: #161b22; border: 1px solid #30363d; color: #e6edf3;
      padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.9rem;
    }
    button { cursor: pointer; background: #1f6feb; border-color: #1f6feb; }
    button:hover { background: #388bfd; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { cursor: pointer; padding: 6px 14px; border-radius: 4px; border: 1px solid #30363d; font-size: 0.85rem; }
    .tab.active { background: #1f6feb; border-color: #1f6feb; }
    #error { color: #f85149; margin-bottom: 12px; font-size: 0.85rem; display: none; }
    #plot { width: 100%; height: 70vh; }
  </style>
</head>
<body>
  <h1>Options Heatmap</h1>

  <div class="controls">
    <input id="ticker" type="text" value="SPY" placeholder="Ticker" style="width:90px; text-transform:uppercase" />
    <select id="metric" onchange="onMetricChange()">
      <option value="openInterest">Open Interest</option>
      <option value="volume">Volume</option>
      <option value="impliedVolatility">Implied Volatility</option>
    </select>
    <input id="expirations" type="number" value="6" min="1" max="12" style="width:70px" title="Max expirations" />
    <button onclick="load()">Load</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-calls" onclick="setView('calls')">Calls</div>
    <div class="tab" id="tab-puts"  onclick="setView('puts')">Puts</div>
    <div class="tab" id="tab-net"   onclick="setView('net')">Net</div>
  </div>

  <div id="error"></div>
  <div id="plot"></div>

  <script>
    let _data = null;
    let _view = "calls";

    const NET_LABELS = {
      openInterest:      "Net OI (Calls − Puts)",
      volume:            "Net Volume (Calls − Puts)",
      impliedVolatility: "IV Skew (Call IV − Put IV)",
    };

    function onMetricChange() {
      const metric = document.getElementById("metric").value;
      document.getElementById("tab-net").textContent =
        metric === "impliedVolatility" ? "IV Skew" : "Net";
      if (_data) load();
    }

    async function load() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const metric = document.getElementById("metric").value;
      const maxExp = document.getElementById("expirations").value;
      const errEl  = document.getElementById("error");
      errEl.style.display = "none";

      try {
        const res = await fetch(`/heatmap/${ticker}?metric=${metric}&max_expirations=${maxExp}`);
        if (!res.ok) {
          const body = await res.json();
          throw new Error(body.detail || res.statusText);
        }
        _data = await res.json();
        render();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = "block";
      }
    }

    function setView(view) {
      _view = view;
      ["calls", "puts", "net"].forEach(v => {
        document.getElementById(`tab-${v}`).classList.toggle("active", v === view);
      });
      if (_data) render();
    }

    function colorscaleFor(metric, view) {
      if (view === "net") {
        return [["0","#f85149"], ["0.5","#161b22"], ["1","#3fb950"]];
      }
      if (metric === "impliedVolatility") {
        // vol surface: low IV = cool blue, high IV = hot red
        return [
          ["0",   "#0d1117"],
          ["0.25","#1f6feb"],
          ["0.5", "#d29922"],
          ["0.75","#f0883e"],
          ["1",   "#f85149"],
        ];
      }
      return [["0","#0d1117"], ["1","#58a6ff"]];
    }

    function formatHover(metric) {
      if (metric === "impliedVolatility") return "%{z:.1%}";
      return "%{z:,}";
    }

    function render() {
      const { strikes, expirations, calls, puts, metric } = _data;

      let z;
      if (_view === "calls") z = calls;
      else if (_view === "puts") z = puts;
      else z = calls.map((row, i) => row.map((v, j) => v - puts[i][j]));

      const label = _view === "net"
        ? NET_LABELS[metric]
        : metric === "impliedVolatility" ? "Implied Volatility" : metric;

      Plotly.newPlot("plot", [{
        type: "heatmap",
        x: expirations,
        y: strikes,
        z,
        colorscale: colorscaleFor(metric, _view),
        hoverongaps: false,
        colorbar: { title: label, tickfont: { color: "#e6edf3" }, titlefont: { color: "#e6edf3" } },
        hovertemplate: `Strike: %{y}<br>Expiry: %{x}<br>${label}: ${formatHover(metric)}<extra></extra>`,
      }], {
        paper_bgcolor: "#0d1117",
        plot_bgcolor:  "#0d1117",
        font: { color: "#e6edf3", family: "monospace" },
        xaxis: { title: "Expiration", tickangle: -30, gridcolor: "#21262d" },
        yaxis: { title: "Strike",     gridcolor: "#21262d" },
        margin: { t: 20, r: 100, b: 80, l: 70 },
      }, { responsive: true });
    }

    load();
  </script>
</body>
</html>
