<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.plot.ly; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:;" />
  <title>Heatmapper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js" integrity="sha384-7TVmlZWH60iKX5Uk7lSvQhjtcgw2tkFjuwLcXoRSR4zXTyWFJRm9aPAguMh7CIra" crossorigin="anonymous"></script>
</head>
<body>

  <!-- ===== Top Nav ===== -->
  <nav class="top-nav">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="28" height="28" rx="6" fill="#1a1a1a"/>
        <rect x="4" y="16" width="4" height="8" rx="1" fill="#e8913a"/>
        <rect x="9.5" y="11" width="4" height="13" rx="1" fill="#e8913a" opacity="0.7"/>
        <rect x="15" y="6" width="4" height="18" rx="1" fill="#e8913a" opacity="0.85"/>
        <rect x="20.5" y="4" width="4" height="20" rx="1" fill="#e8913a"/>
      </svg>
      Heatmapper
    </a>

    <ul class="nav-links">
      <li><a class="nav-link active" href="/">Dashboard</a></li>
      <li><a class="nav-link" href="/watchlist">Watchlist</a></li>
      <li><a class="nav-link" href="/news">News</a></li>
      <li><a class="nav-link" href="/settings">Settings</a></li>
    </ul>

    <div class="nav-actions">
      <button class="btn-icon" title="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      </button>
      <button class="btn-icon" title="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
      </button>
      <a href="/settings" id="user-avatar" style="width:32px;height:32px;border-radius:50%;background:var(--color-primary);display:flex;align-items:center;justify-content:center;color:white;font-weight:600;font-size:var(--text-sm);cursor:pointer;text-decoration:none;" title="Settings">U</a>
    </div>
  </nav>

  <!-- ===== Main Content ===== -->
  <main class="page-container">
    <div class="page-header">
      <h1 class="page-title">Dashboard</h1>
      <div class="flex items-center gap-3">
        <span class="text-sm text-secondary" id="last-updated"></span>
      </div>
    </div>

    <!-- Ticker + Controls Card -->
    <div class="card mb-4">
      <div class="controls-bar">
        <div class="input-group">
          <label class="input-label" for="ticker">Ticker</label>
          <input class="input-field font-mono" id="ticker" type="text" value="SPY" placeholder="e.g. SPY" style="width:100px; text-transform:uppercase" />
        </div>

        <div class="input-group">
          <label class="input-label" for="metric">Metric</label>
          <select class="input-field" id="metric" onchange="onMetricChange()">
            <option value="probability">Price Probability</option>
            <option value="openInterest">Open Interest</option>
            <option value="volume">Volume</option>
            <option value="impliedVolatility">Implied Volatility</option>
          </select>
        </div>

        <div class="input-group">
          <label class="input-label" for="expirations">Expirations</label>
          <input class="input-field" id="expirations" type="number" value="6" min="1" max="12" style="width:70px" />
        </div>

        <div class="input-group" id="band-group">
          <label class="input-label" for="band">Band Width ($)</label>
          <input class="input-field" id="band" type="number" value="5" min="0.5" max="100" step="0.5" style="width:80px" />
        </div>

        <div class="input-group" style="justify-content:flex-end">
          <label class="input-label">&nbsp;</label>
          <button class="btn btn-primary" onclick="load()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
            Load
          </button>
        </div>
      </div>
    </div>

    <!-- Dashboard Grid -->
    <div class="dashboard-grid dashboard-grid--two-col">

      <!-- Heatmap Card -->
      <div class="card">
        <div class="card-header">
          <div>
            <h2 class="card-title" id="chart-title">Options Heatmap</h2>
            <p class="card-subtitle" id="chart-subtitle">SPY - Price Probability</p>
          </div>
          <div class="flex items-center gap-3">
            <div class="tab-group" id="view-tabs">
              <button class="tab-btn active" id="tab-calls" onclick="setView('calls')">Calls</button>
              <button class="tab-btn" id="tab-puts" onclick="setView('puts')">Puts</button>
              <button class="tab-btn" id="tab-net" onclick="setView('net')">Net</button>
            </div>
            <button class="card-menu-btn" onclick="refreshTicker()" title="Refresh data">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
            </button>
          </div>
        </div>
        <div id="error" class="error-msg"></div>
        <div id="plot" class="plot-container"></div>
      </div>

      <!-- Right Sidebar -->
      <div class="flex flex-col gap-6">

        <!-- Spot Price Card -->
        <div class="card" id="spot-card">
          <div class="card-header">
            <h3 class="card-title">Spot Price</h3>
          </div>
          <div class="stat-value font-mono" id="spot-price">--</div>
          <p class="stat-label mt-2" id="spot-ticker">SPY</p>
        </div>

        <!-- Quick Stats Card -->
        <div class="card" id="stats-card">
          <div class="card-header">
            <h3 class="card-title">Quick Stats</h3>
          </div>
          <div class="flex flex-col gap-4" id="stats-list">
            <div class="flex justify-between items-center">
              <span class="text-sm text-secondary">Expirations Loaded</span>
              <span class="font-semibold font-mono" id="stat-expirations">--</span>
            </div>
            <div class="divider"></div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-secondary">Strike Range</span>
              <span class="font-semibold font-mono" id="stat-strike-range">--</span>
            </div>
            <div class="divider"></div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-secondary">Nearest Expiry</span>
              <span class="font-semibold font-mono" id="stat-nearest-expiry">--</span>
            </div>
            <div class="divider"></div>
            <div class="flex justify-between items-center">
              <span class="text-sm text-secondary">Metric</span>
              <span class="badge badge--info" id="stat-metric">Probability</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- News Card (full width, below chart) -->
    <div class="card mt-4">
      <div class="card-header">
        <h3 class="card-title">Latest News</h3>
        <button class="card-menu-btn" onclick="loadNews()" title="Refresh news">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        </button>
      </div>
      <div id="news-list" class="news-grid">
        <p class="text-sm text-muted" style="text-align:center;padding:var(--space-4) 0;grid-column:1/-1;">Loading news...</p>
      </div>
    </div>
  </main>

  <script>
    let _data = null;
    let _view = "calls";

    const METRIC_LABELS = {
      probability:        "Price Probability",
      openInterest:       "Open Interest",
      volume:             "Volume",
      impliedVolatility:  "Implied Volatility",
    };

    const NET_LABELS = {
      openInterest:      "Net OI (Calls - Puts)",
      volume:            "Net Volume (Calls - Puts)",
      impliedVolatility: "IV Skew (Call IV - Put IV)",
    };

    const PLOTLY_LAYOUT_BASE = {
      paper_bgcolor: "rgba(0,0,0,0)",
      plot_bgcolor:  "#fafafa",
      font: { color: "#1a1a1a", family: "Inter, sans-serif", size: 12 },
      xaxis: {
        title: { text: "Expiration", font: { size: 12, color: "#6b6b6b" } },
        type: "category",
        tickangle: -30,
        gridcolor: "#e5e5e5",
        linecolor: "#e5e5e5",
      },
      yaxis: {
        title: { text: "Strike", font: { size: 12, color: "#6b6b6b" } },
        gridcolor: "#e5e5e5",
        linecolor: "#e5e5e5",
      },
      margin: { t: 10, r: 100, b: 70, l: 65 },
    };

    function onMetricChange() {
      const metric = document.getElementById("metric").value;
      const isProb = metric === "probability";
      document.getElementById("view-tabs").style.display = isProb ? "none" : "inline-flex";
      document.getElementById("band-group").style.display = isProb ? "flex" : "none";
      document.getElementById("tab-net").textContent =
        metric === "impliedVolatility" ? "IV Skew" : "Net";
      if (_data) load();
    }

    function updateSidebar(data) {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const metric = document.getElementById("metric").value;

      document.getElementById("chart-subtitle").textContent =
        `${ticker} - ${METRIC_LABELS[metric]}`;

      if (data.spot_price != null) {
        document.getElementById("spot-price").textContent = `$${data.spot_price.toFixed(2)}`;
      } else {
        document.getElementById("spot-price").textContent = "--";
      }
      document.getElementById("spot-ticker").textContent = ticker;

      document.getElementById("stat-expirations").textContent = data.expirations.length;
      const strikes = data.strikes;
      document.getElementById("stat-strike-range").textContent =
        `$${strikes[0].toFixed(0)} - $${strikes[strikes.length - 1].toFixed(0)}`;
      document.getElementById("stat-nearest-expiry").textContent = data.expirations[0] || "--";
      document.getElementById("stat-metric").textContent = METRIC_LABELS[metric];

      document.getElementById("last-updated").textContent =
        `Updated ${new Date().toLocaleTimeString()}`;
    }

    async function load() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const metric = document.getElementById("metric").value;
      const maxExp = document.getElementById("expirations").value;
      const errEl  = document.getElementById("error");
      errEl.style.display = "none";

      const band = document.getElementById("band").value;
      const url = metric === "probability"
        ? `/probability/${ticker}?max_expirations=${maxExp}&band_width=${band}`
        : `/heatmap/${ticker}?metric=${metric}&max_expirations=${maxExp}`;

      try {
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.json();
          throw new Error(body.detail || res.statusText);
        }
        _data = await res.json();
        updateSidebar(_data);
        render();
        loadNews();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = "block";
      }
    }

    async function refreshTicker() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      await fetch(`/heatmap/${ticker}/refresh`, { method: "POST" });
      load();
    }

    function setView(view) {
      _view = view;
      ["calls", "puts", "net"].forEach(v => {
        document.getElementById(`tab-${v}`).classList.toggle("active", v === view);
      });
      if (_data) render();
    }

    function colorscaleFor(metric, view) {
      if (view === "net") {
        return [
          [0,   "#ef4444"],
          [0.5, "#fafafa"],
          [1,   "#22c55e"],
        ];
      }
      return [
        [0,    "#eff6ff"],
        [0.25, "#93c5fd"],
        [0.5,  "#f59e0b"],
        [0.75, "#ef4444"],
        [1,    "#991b1b"],
      ];
    }

    function formatHover(metric) {
      if (metric === "impliedVolatility") return "%{z:.1%}";
      return "%{z:,}";
    }

    const PROB_COLORSCALE = [
      [0,     "#f5f5f7"],
      [0.001, "#dbeafe"],
      [0.35,  "#60a5fa"],
      [0.6,   "#f59e0b"],
      [0.8,   "#ef4444"],
      [1,     "#991b1b"],
    ];

    function renderProbability() {
      const { strikes, expirations, probabilities, spot_price, expected_prices } = _data;

      const colMax = expirations.map((_, j) =>
        Math.max(...probabilities.map(row => row[j])) || 1
      );
      const zColor = probabilities.map(row => row.map((v, j) => v / colMax[j]));

      const traces = [{
        type: "heatmap",
        x: expirations,
        y: strikes,
        z: zColor,
        customdata: probabilities,
        zmin: 0,
        zmax: 1,
        colorscale: PROB_COLORSCALE,
        hoverongaps: false,
        colorbar: {
          title: "Likelihood",
          tickvals: [0, 1],
          ticktext: ["Low", "High"],
          tickfont: { color: "#6b6b6b" },
          titlefont: { color: "#6b6b6b" },
        },
        hovertemplate: "Price ~ $%{y}<br>Expiry: %{x}<br>P ~ %{customdata:.2f}%<extra></extra>",
      }];

      if (spot_price != null) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          x: expirations,
          y: Array(expirations.length).fill(spot_price),
          line: { color: "#1a1a1a", width: 2, dash: "dot" },
          marker: { size: 8, color: "#1a1a1a", symbol: "circle", line: { color: "#fff", width: 1.5 } },
          name: `Spot $${spot_price.toFixed(2)}`,
          hovertemplate: `Spot: $${spot_price.toFixed(2)}<extra></extra>`,
        });
      }

      if (expected_prices && expected_prices.length) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          x: expirations,
          y: expected_prices,
          line: { color: "#2563eb", width: 2 },
          marker: { size: 8, color: "#2563eb", symbol: "diamond", line: { color: "#fff", width: 1.5 } },
          name: "Weighted avg prediction",
          hovertemplate: "Predicted: $%{y:.2f}<br>Expiry: %{x}<extra></extra>",
        });
      }

      const hasOverlay = spot_price != null || (expected_prices && expected_prices.length);
      const layout = {
        ...PLOTLY_LAYOUT_BASE,
        yaxis: { ...PLOTLY_LAYOUT_BASE.yaxis, title: { text: "Price", font: { size: 12, color: "#6b6b6b" } } },
        showlegend: hasOverlay,
        legend: { x: 1.08, y: 1, font: { color: "#6b6b6b", size: 11 } },
      };

      Plotly.newPlot("plot", traces, layout, { responsive: true });
    }

    function render() {
      if (_data && _data.metric === "probability") { renderProbability(); return; }

      const { strikes, expirations, calls, puts, metric, spot_price } = _data;

      let z;
      if (_view === "calls") z = calls;
      else if (_view === "puts") z = puts;
      else z = calls.map((row, i) => row.map((v, j) => v - puts[i][j]));

      const label = _view === "net"
        ? NET_LABELS[metric]
        : metric === "impliedVolatility" ? "Implied Volatility" : metric;

      const traces = [{
        type: "heatmap",
        x: expirations,
        y: strikes,
        z,
        colorscale: colorscaleFor(metric, _view),
        hoverongaps: false,
        colorbar: { title: label, tickfont: { color: "#6b6b6b" }, titlefont: { color: "#6b6b6b" } },
        hovertemplate: `Strike: %{y}<br>Expiry: %{x}<br>${label}: ${formatHover(metric)}<extra></extra>`,
      }];

      if (spot_price != null) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          x: expirations,
          y: Array(expirations.length).fill(spot_price),
          line: { color: "#1a1a1a", width: 2, dash: "dot" },
          marker: { size: 8, color: "#1a1a1a", symbol: "circle", line: { color: "#fff", width: 1.5 } },
          name: `Spot $${spot_price.toFixed(2)}`,
          hovertemplate: `Spot: $${spot_price.toFixed(2)}<extra></extra>`,
        });
      }

      const layout = {
        ...PLOTLY_LAYOUT_BASE,
        showlegend: spot_price != null,
        legend: { x: 1.08, y: 1, font: { color: "#6b6b6b", size: 11 } },
      };

      Plotly.newPlot("plot", traces, layout, { responsive: true });
    }

    function setNewsMessage(msg) {
      const c = document.getElementById("news-list");
      c.textContent = "";
      const p = document.createElement("p");
      p.className = "text-sm text-muted";
      p.style.cssText = "text-align:center;padding:var(--space-4) 0;grid-column:1/-1;";
      p.textContent = msg;
      c.appendChild(p);
    }

    function buildNewsItem(a) {
      const item = document.createElement("div");
      item.className = "news-item";

      const topRow = document.createElement("div");
      topRow.className = "flex justify-between items-center gap-2";

      const badge = document.createElement("span");
      const badgeClass = a.sentiment_label === "positive" ? "badge--positive"
        : a.sentiment_label === "negative" ? "badge--negative" : "badge--neutral";
      badge.className = `badge ${badgeClass}`;
      badge.textContent = a.sentiment_label;

      const time = document.createElement("span");
      time.className = "text-xs text-muted";
      time.textContent = a.published || "";

      topRow.appendChild(badge);
      topRow.appendChild(time);
      item.appendChild(topRow);

      const title = document.createElement("p");
      title.className = "news-title";
      title.textContent = a.title;

      try {
        const u = a.url ? new URL(a.url) : null;
        if (u && (u.protocol === "http:" || u.protocol === "https:")) {
          const link = document.createElement("a");
          link.href = u.href;
          link.target = "_blank";
          link.rel = "noopener";
          link.style.cssText = "color:var(--color-text);text-decoration:none;";
          link.appendChild(title);
          item.appendChild(link);
        } else {
          item.appendChild(title);
        }
      } catch {
        item.appendChild(title);
      }

      const source = document.createElement("p");
      source.className = "text-xs text-secondary";
      source.textContent = a.source;
      item.appendChild(source);

      return item;
    }

    async function loadNews() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const container = document.getElementById("news-list");
      setNewsMessage("Loading...");

      try {
        const res = await fetch(`/api/news/${ticker}?limit=5`);
        if (!res.ok) throw new Error("Failed to load news");
        const data = await res.json();

        if (!data.articles.length) { setNewsMessage("No news found."); return; }

        container.textContent = "";
        data.articles.forEach(a => container.appendChild(buildNewsItem(a)));
      } catch {
        setNewsMessage("Could not load news.");
      }
    }

    async function loadUser() {
      try {
        const res = await fetch("/api/me");
        if (!res.ok) { window.location.href = "/login"; return; }
        const user = await res.json();
        const avatar = document.getElementById("user-avatar");
        avatar.textContent = user.username.charAt(0).toUpperCase();
        avatar.title = `Signed in as ${user.username}`;
      } catch { window.location.href = "/login"; }
    }

    async function initPush() {
      if (!("serviceWorker" in navigator) || !("PushManager" in window)) return;
      try {
        const reg = await navigator.serviceWorker.register("/sw.js");
        const existing = await reg.pushManager.getSubscription();
        if (existing) return;

        const res = await fetch("/api/push/vapid-key");
        const { publicKey } = await res.json();
        if (!publicKey) return;

        const btn = document.querySelector('[title="Notifications"]');
        btn.addEventListener("click", async () => {
          const permission = await Notification.requestPermission();
          if (permission !== "granted") return;

          const sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });

          await fetch("/api/push/subscribe", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ subscription: sub.toJSON() }),
          });

          btn.style.color = "var(--color-accent-green)";
          btn.title = "Notifications enabled";
        });
      } catch { /* push not available */ }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
      const raw = atob(base64);
      const arr = new Uint8Array(raw.length);
      for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }

    // Init
    const urlTicker = new URLSearchParams(window.location.search).get("ticker");
    if (urlTicker) document.getElementById("ticker").value = urlTicker.toUpperCase();
    loadUser();
    onMetricChange();
    load();
    loadNews();
    initPush();
  </script>
</body>
</html>
