<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Options Heatmap</title>
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d1117; color: #e6edf3; font-family: monospace; padding: 24px; }
    h1 { font-size: 1.2rem; margin-bottom: 16px; letter-spacing: 0.05em; color: #58a6ff; }
    .controls { display: flex; gap: 12px; margin-bottom: 20px; align-items: center; }
    input, select, button {
      background: #161b22; border: 1px solid #30363d; color: #e6edf3;
      padding: 8px 12px; border-radius: 6px; font-family: monospace; font-size: 0.9rem;
    }
    button { cursor: pointer; background: #1f6feb; border-color: #1f6feb; }
    button:hover { background: #388bfd; }
    .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab { cursor: pointer; padding: 6px 14px; border-radius: 4px; border: 1px solid #30363d; font-size: 0.85rem; }
    .tab.active { background: #1f6feb; border-color: #1f6feb; }
    #error { color: #f85149; margin-bottom: 12px; font-size: 0.85rem; display: none; }
    #plot { width: 100%; height: 70vh; }
  </style>
</head>
<body>
  <h1>Options Heatmap</h1>

  <div class="controls">
    <input id="ticker" type="text" value="SPY" placeholder="Ticker" style="width:90px; text-transform:uppercase" />
    <select id="metric" onchange="onMetricChange()">
      <option value="probability">Price Probability</option>
      <option value="openInterest">Open Interest</option>
      <option value="volume">Volume</option>
      <option value="impliedVolatility">Implied Volatility</option>
    </select>
    <input id="expirations" type="number" value="6" min="1" max="12" style="width:70px" title="Max expirations" />
    <input id="band" type="number" value="5" min="0.5" max="100" step="0.5" style="width:80px" title="Price band width $ (probability mode — lower = zoom in)" />
    <button onclick="load()">Load</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-calls" onclick="setView('calls')">Calls</div>
    <div class="tab" id="tab-puts"  onclick="setView('puts')">Puts</div>
    <div class="tab" id="tab-net"   onclick="setView('net')">Net</div>
  </div>

  <div id="error"></div>
  <div id="plot"></div>

  <script>
    let _data = null;
    let _view = "calls";

    const NET_LABELS = {
      openInterest:      "Net OI (Calls − Puts)",
      volume:            "Net Volume (Calls − Puts)",
      impliedVolatility: "IV Skew (Call IV − Put IV)",
    };

    function onMetricChange() {
      const metric = document.getElementById("metric").value;
      const isProb = metric === "probability";
      // calls/puts/net tabs are meaningless for a single price distribution
      document.querySelector(".tabs").style.display = isProb ? "none" : "flex";
      document.getElementById("tab-net").textContent =
        metric === "impliedVolatility" ? "IV Skew" : "Net";
      if (_data) load();
    }

    async function load() {
      const ticker = document.getElementById("ticker").value.trim().toUpperCase();
      const metric = document.getElementById("metric").value;
      const maxExp = document.getElementById("expirations").value;
      const errEl  = document.getElementById("error");
      errEl.style.display = "none";

      const band   = document.getElementById("band").value;
      const url = metric === "probability"
        ? `/probability/${ticker}?max_expirations=${maxExp}&band_width=${band}`
        : `/heatmap/${ticker}?metric=${metric}&max_expirations=${maxExp}`;

      try {
        const res = await fetch(url);
        if (!res.ok) {
          const body = await res.json();
          throw new Error(body.detail || res.statusText);
        }
        _data = await res.json();
        render();
      } catch (e) {
        errEl.textContent = e.message;
        errEl.style.display = "block";
      }
    }

    function setView(view) {
      _view = view;
      ["calls", "puts", "net"].forEach(v => {
        document.getElementById(`tab-${v}`).classList.toggle("active", v === view);
      });
      if (_data) render();
    }

    function colorscaleFor(metric, view) {
      if (view === "net") {
        return [["0","#f85149"], ["0.5","#161b22"], ["1","#3fb950"]];
      }
      // blue (cold/low) → red (hot/high) for all single-side views
      return [
        ["0",    "#1a237e"],
        ["0.25", "#1976d2"],
        ["0.5",  "#fbc02d"],
        ["0.75", "#e53935"],
        ["1",    "#b71c1c"],
      ];
    }

    function formatHover(metric) {
      if (metric === "impliedVolatility") return "%{z:.1%}";
      return "%{z:,}";
    }

    // blue (0%, default) -> red (high probability)
    const PROB_COLORSCALE = [
      ["0",    "#0d1117"],
      ["0.001","#1a237e"],
      ["0.35", "#1976d2"],
      ["0.6",  "#fbc02d"],
      ["0.8",  "#e53935"],
      ["1",    "#b71c1c"],
    ];

    function renderProbability() {
      const { strikes, expirations, probabilities, spot_price } = _data;

      // Color each day relative to its own most-likely strike, otherwise a
      // near-dated 0DTE spike (≈100% in one cell) saturates the scale and
      // washes every other column to blue. True % is kept for the hover.
      const colMax = expirations.map((_, j) =>
        Math.max(...probabilities.map(row => row[j])) || 1
      );
      const zColor = probabilities.map(row => row.map((v, j) => v / colMax[j]));

      const traces = [{
        type: "heatmap",
        x: expirations,
        y: strikes,
        z: zColor,
        customdata: probabilities,
        zmin: 0,
        zmax: 1,
        colorscale: PROB_COLORSCALE,
        hoverongaps: false,
        colorbar: {
          title: "Likelihood",
          tickvals: [0, 1],
          ticktext: ["Low", "High"],
          tickfont: { color: "#e6edf3" },
          titlefont: { color: "#e6edf3" },
        },
        hovertemplate: "Price ≈ $%{y}<br>Expiry: %{x}<br>P ≈ %{customdata:.2f}%<extra></extra>",
      }];

      if (spot_price != null) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          x: expirations,
          y: Array(expirations.length).fill(spot_price),
          line: { color: "#ffffff", width: 2, dash: "dot" },
          marker: { size: 10, color: "#ffffff", symbol: "circle", line: { color: "#111", width: 1.5 } },
          name: `Spot $${spot_price.toFixed(2)}`,
          hovertemplate: `Spot: $${spot_price.toFixed(2)}<extra></extra>`,
        });
      }

      Plotly.newPlot("plot", traces, {
        paper_bgcolor: "#0d1117",
        plot_bgcolor:  "#0d1117",
        font: { color: "#e6edf3", family: "monospace" },
        xaxis: { title: "Expiration", type: "category", tickangle: -30, gridcolor: "#21262d" },
        yaxis: { title: "Price",      gridcolor: "#21262d" },
        margin: { t: 20, r: 110, b: 80, l: 70 },
        showlegend: spot_price != null,
        legend: { x: 1.1, y: 1, font: { color: "#e6edf3" } },
      }, { responsive: true });
    }

    function render() {
      if (_data && _data.metric === "probability") { renderProbability(); return; }

      const { strikes, expirations, calls, puts, metric, spot_price } = _data;

      let z;
      if (_view === "calls") z = calls;
      else if (_view === "puts") z = puts;
      else z = calls.map((row, i) => row.map((v, j) => v - puts[i][j]));

      const label = _view === "net"
        ? NET_LABELS[metric]
        : metric === "impliedVolatility" ? "Implied Volatility" : metric;

      const traces = [{
        type: "heatmap",
        x: expirations,
        y: strikes,
        z,
        colorscale: colorscaleFor(metric, _view),
        hoverongaps: false,
        colorbar: { title: label, tickfont: { color: "#e6edf3" }, titlefont: { color: "#e6edf3" } },
        hovertemplate: `Strike: %{y}<br>Expiry: %{x}<br>${label}: ${formatHover(metric)}<extra></extra>`,
      }];

      if (spot_price != null) {
        traces.push({
          type: "scatter",
          mode: "lines+markers",
          x: expirations,
          y: Array(expirations.length).fill(spot_price),
          line: { color: "#ffffff", width: 2, dash: "dot" },
          marker: { size: 10, color: "#ffffff", symbol: "circle", line: { color: "#111", width: 1.5 } },
          name: `Spot $${spot_price.toFixed(2)}`,
          hovertemplate: `Spot: $${spot_price.toFixed(2)}<extra></extra>`,
        });
      }

      Plotly.newPlot("plot", traces, {
        paper_bgcolor: "#0d1117",
        plot_bgcolor:  "#0d1117",
        font: { color: "#e6edf3", family: "monospace" },
        xaxis: { title: "Expiration", type: "category", tickangle: -30, gridcolor: "#21262d" },
        yaxis: { title: "Strike",     gridcolor: "#21262d" },
        margin: { t: 20, r: 100, b: 80, l: 70 },
        showlegend: spot_price != null,
        legend: { x: 1.08, y: 1, font: { color: "#e6edf3" } },
      }, { responsive: true });
    }

    // sync tab visibility to the default metric, then load
    document.querySelector(".tabs").style.display =
      document.getElementById("metric").value === "probability" ? "none" : "flex";
    load();
  </script>
</body>
</html>
