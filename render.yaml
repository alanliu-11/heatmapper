services:
  - type: web
    name: options-heatmap
    runtime: python
    # VADER sentiment is pure-Python and light (~150MB RAM), and state lives in a
    # free hosted Postgres (Neon), so this runs comfortably on Render's free tier.
    plan: free
    region: oregon
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.4"
      # Neon Postgres connection string (use the POOLED connection string).
      # Set in the Render dashboard — never commit it.
      - key: DATABASE_URL
        sync: false
      # JWT signing key — Render generates a strong random value once.
      - key: SECRET_KEY
        generateValue: true
      # Optional: Web Push notifications. Set in the dashboard if you use them.
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      # Optional: Bright Data Web Unlocker for scraping. Set if you use them.
      - key: BRIGHTDATA_USER
        sync: false
      - key: BRIGHTDATA_PASS
        sync: false
      - key: BRIGHTDATA_API_TOKEN
        sync: false

# Note: Render's free web service spins down after ~15 min of inactivity, so the
# first request after idle is slow (~30s cold start) and the in-process background
# scanner pauses while asleep. Both are fine for a hobby/demo deploy.
